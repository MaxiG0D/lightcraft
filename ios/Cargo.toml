# The iOS bridge: its own workspace, so the main workspace's `cargo xtask ci` (layers, wasm, clippy)
# never sees it. It depends on the engine-layer crates by path. See ios/README.md.
[workspace]
resolver = "3"
members = ["lightcraft-ffi", "tools/gen-theme"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

# The main workspace's clippy lints. Its `unsafe_code = "deny"` is left out: uniffi's generated FFI
# glue is `unsafe` (see CLAUDE.md); hand-written code here stays safe.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
excessive_precision = "allow"

# Same as the main workspace: optimize dependencies even in debug builds (per-pixel work).
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# panic = "unwind" (the default) is required: uniffi turns an escaped panic into a Swift error.
[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
