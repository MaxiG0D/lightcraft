# XcodeGen spec: `cd ios/app && xcodegen` writes LightCraft.xcodeproj (generated, not committed).
# Build the Rust side first: ios/build-xcframework.sh (it also writes Generated/: bindings, the theme,
# icons and app icon generated from the desktop UI crate).
name: LightCraft
options:
  bundleIdPrefix: org.storytold
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LightCraft:
    type: application
    platform: iOS
    sources:
      - path: LightCraft
      - path: Generated
      # the desktop UI font, used in place (not copied): assets/fonts
      - path: ../../assets/fonts/Inter-Regular.ttf
        buildPhase: resources
      - path: ../../assets/fonts/Inter-Medium.ttf
        buildPhase: resources
      - path: ../../assets/fonts/Inter-SemiBold.ttf
        buildPhase: resources
      - path: ../../assets/fonts/OFL-Inter.txt
        buildPhase: resources
    dependencies:
      - framework: ../build/LightCraftFFI.xcframework
        embed: false
      # wgpu's Metal backend
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    info:
      path: LightCraft/Info.plist
      properties:
        CFBundleDisplayName: LightCraft
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
        NSPhotoLibraryAddUsageDescription: LightCraft saves the photos you export to your library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.storytold.lightcraft-ios
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
